<h2>预设系统选择</h2>
<p class="subtitle">用户选择了 C：灵活选项 — 样式预设 + 完整预设</p>

<div class="pros-cons">
  <div class="pros">
    <h4>样式预设</h4>
    <ul>
      <li>保存：边框、背景色、圆角</li>
      <li>不保存：信息字段</li>
      <li>适用：只想要边框样式，每张图保留自己的文字</li>
    </ul>
  </div>
  <div class="cons">
    <h4>完整预设</h4>
    <ul>
      <li>保存：边框 + 信息字段（模板、字号、字色、对齐方式、extraLines）</li>
      <li>应用时：整张照片的样式完全同步</li>
      <li>适用：多张照片需要一模一样排版</li>
    </ul>
  </div>
</div>
